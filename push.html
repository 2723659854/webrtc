<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 屏幕推流（Canvas 代理）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 780px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 15px; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .settings { display: flex; gap: 16px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; padding: 10px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 6px; }
        .setting { display: flex; align-items: center; gap: 6px; }
        .setting label { color: #888; font-size: 0.85em; }
        .setting select, .setting input { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #0f0f1a; color: #e0e0e0; font-size: 0.9em; }
        .setting select:focus, .setting input:focus { outline: none; border-color: #4cc9f0; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95em; cursor: pointer; font-weight: 500; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-start { background: #4cc9f0; color: #000; }
        .btn-stop { background: #f72585; color: #fff; }
        .status { padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .status.idle { background: #1a1a2e; color: #666; }
        .status.connecting { background: #2a1a0a; color: #ff9f1c; }
        .status.streaming { background: #0a2a1a; color: #06d6a0; }
        .status.failed { background: #2a0a0a; color: #f72585; }
        .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .panel-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .panel-box canvas, .panel-box video { width: 100%; max-height: 260px; border-radius: 4px; background: #111; display: block; }
        .panel-title { color: #888; font-size: 0.8em; margin-bottom: 6px; }
        .log-box { background: #000; border: 1px solid #2a2a3e; border-radius: 8px; padding: 12px; margin-top: 15px; max-height: 260px; overflow-y: auto; font-family: monospace; font-size: 0.8em; }
        .log-box .time { color: #555; }
        .log-box .info { color: #ccc; }
        .log-box .warn { color: #ff9f1c; }
        .log-box .success { color: #06d6a0; }
        .log-box .error { color: #f72585; }
    </style>
</head>
<body>
<div class="container">
    <h1>📺 屏幕推流（Canvas 代理）</h1>
    <p class="subtitle">捕获屏幕（视频+真实音频） → Canvas 代理 → WebRTC 推流，房间 ID: <span id="roomIdDisplay">stream_001</span></p>
    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="startPush()">▶ 开始推流</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopPush()" disabled>■ 停止</button>
    </div>
    <div class="status idle" id="status">⚪ 空闲</div>

    <div class="settings">
        <div class="setting">
            <label>信令</label>
            <input type="text" id="wsUrlInput" style="width:120px;">
        </div>
        <div class="setting">
            <label>房间</label>
            <input type="text" id="roomIdInput" value="stream_001" style="width:80px;">
        </div>
        <div class="setting">
            <label>分辨率</label>
            <select id="resSelect" onchange="onResChange()">
                <option value="640x360">640×360</option>
                <option value="854x480" selected>854×480</option>
                <option value="1280x720">1280×720</option>
            </select>
        </div>
        <div class="setting">
            <label>帧率</label>
            <select id="fpsSelect" onchange="onFpsChange()">
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="25" selected>25</option>
                <option value="30">30</option>
            </select>
        </div>
        <div class="setting">
            <label>码率</label>
            <select id="bitrateSelect" onchange="onBitrateChange()">
                <option value="500">500k</option>
                <option value="1000">1000k</option>
                <option value="1500">1500k</option>
                <option value="2000" selected>2000k</option>
                <option value="2500">2500k</option>
            </select>
        </div>
    </div>

    <div class="media-grid">
        <div class="panel-box">
            <div class="panel-title">Canvas 代理（推流内容）</div>
            <canvas id="proxyCanvas" width="854" height="480" style="aspect-ratio:16/9;"></canvas>
        </div>
        <div class="panel-box">
            <div class="panel-title">本地预览（MediaStream）</div>
            <video id="localVideo" autoplay muted playsinline style="aspect-ratio:16/9;"></video>
        </div>
    </div>

    <div class="log-box" id="logBox"></div>
</div>

<script>
    // ========== 配置 ==========
    let CANVAS_W = 854, CANVAS_H = 480, CANVAS_FPS = 25, CUR_BITRATE_KBPS = 2000;
    const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    let ROOM_ID = 'stream_001';

    // ========== 状态 ==========
    let pc = null, ws = null, localStream = null;
    let isStreaming = false, joined = false;
    let drawTimer = null, watchdogTimer = null;
    let drawFrameCount = 0, lastDrawFrameCount = 0;
    let captureStream = null;  // 屏幕捕获流
    let hiddenVideo = null;   // 隐藏 video 解码屏幕流

    function $(id) { return document.getElementById(id); }
    $('wsUrlInput').value = WS_URL;
    function log(msg, level='info') {
        const div = document.createElement('div');
        const time = new Date().toLocaleTimeString();
        div.innerHTML = `<span class="time">${time}</span> <span class="${level}">${msg}</span>`;
        $('logBox').appendChild(div);
        $('logBox').scrollTop = $('logBox').scrollHeight;
    }
    function setStatus(text, state) {
        const el = $('status');
        el.textContent = text;
        el.className = 'status ' + state;
    }
    function setButtons(starting) {
        $('btnStart').disabled = starting;
        $('btnStop').disabled = !starting;
    }

    // ========== UI 热更新回调 ==========
    function onResChange() {
        const v = $('resSelect').value;
        const [w, h] = v.split('x').map(Number);
        if (!w || !h) return;
        CANVAS_W = w; CANVAS_H = h;
        const cv = $('proxyCanvas');
        cv.width = w; cv.height = h;
        if (isStreaming) log(`分辨率热更新: ${w}x${h}`, 'info');
    }
    function onFpsChange() {
        const f = parseInt($('fpsSelect').value, 10);
        if (!f || f < 1) return;
        CANVAS_FPS = f;
        if (drawTimer) {
            clearInterval(drawTimer);
            const intervalMs = Math.max(16, Math.floor(1000 / CANVAS_FPS));
            drawTimer = setInterval(() => drawOneFrame(), intervalMs);
        }
        if (isStreaming) log(`帧率热更新: ${f}fps`, 'info');
    }
    async function onBitrateChange() {
        const k = parseInt($('bitrateSelect').value, 10);
        if (!k || k < 1) return;
        CUR_BITRATE_KBPS = k;
        if (pc && isStreaming) {
            try {
                for (const s of pc.getSenders()) {
                    if (s.track && s.track.kind === 'video') {
                        const params = s.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        params.encodings[0].maxBitrate = k * 1000;
                        await s.setParameters(params);
                        log(`码率热更新: ${k}kbps`, 'success');
                    }
                }
            } catch (e) {
                log(`码率热更新失败: ${e.message}`, 'warn');
            }
        }
    }

    // ========== 获取屏幕流（含真实音频） ==========
    async function getDisplayMediaStream() {
        const constraints = {
            video: {
                cursor: 'always',
                width: { ideal: CANVAS_W },
                height: { ideal: CANVAS_H },
                frameRate: { ideal: CANVAS_FPS, max: CANVAS_FPS + 5 },
            },
            audio: true,  // 真实音频
        };

        try {
            log('📸 请求屏幕共享（含系统音频）...', 'info');
            const stream = await navigator.mediaDevices.getDisplayMedia(constraints);

            const vTrack = stream.getVideoTracks()[0];
            const aTrack = stream.getAudioTracks()[0];

            if (!vTrack) throw new Error('无视频轨道');

            const vs = vTrack.getSettings();
            log(`✅ 视频: ${vs.width}x${vs.height} @ ${vs.frameRate || CANVAS_FPS}fps`, 'success');

            if (aTrack) {
                log(`✅ 音频: 已捕获系统音频`, 'success');
            } else {
                log(`⚠️ 未捕获到音频（可能未勾选"分享音频"）`, 'warn');
            }

            vTrack.onended = () => {
                log('⚠️ 用户停止共享', 'warn');
                if (isStreaming) stopPush();
            };

            return stream;
        } catch (e) {
            log(`❌ 捕获失败: ${e.message}`, 'error');
            throw e;
        }
    }

    // ========== Canvas 代理绘制 ==========
    function drawOneFrame() {
        const canvas = $('proxyCanvas');
        const ctx = canvas.getContext('2d');

        try {
            // 绘制屏幕内容
            if (hiddenVideo && hiddenVideo.readyState >= 2) {
                ctx.drawImage(hiddenVideo, 0, 0, CANVAS_W, CANVAS_H);

                // 注入微弱噪点保持编码器活跃
                const imageData = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 800) {
                    if (Math.random() < 0.2) {
                        const idx = i + (Math.floor(Math.random() * 4) % 4);
                        if (idx < data.length) {
                            data[idx] = Math.min(255, Math.max(0, data[idx] + (Math.random() > 0.5 ? 1 : -1)));
                        }
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            } else {
                // 尚未获取到屏幕内容时，显示提示
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.fillStyle = '#888';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('等待屏幕内容...', CANVAS_W / 2, CANVAS_H / 2);
                ctx.textAlign = 'start';
            }
        } catch (e) {
            // 忽略绘制错误
        }

        drawFrameCount++;
    }

    function startCanvasDraw() {
        stopCanvasDraw();
        drawFrameCount = 0;
        lastDrawFrameCount = 0;
        const intervalMs = Math.max(16, Math.floor(1000 / CANVAS_FPS));

        // 初始化隐藏 video（仅用于视频解码）
        hiddenVideo = document.createElement('video');
        hiddenVideo.muted = true;
        hiddenVideo.playsInline = true;

        // 创建只含视频轨道的流给 hiddenVideo 解码
        if (captureStream) {
            const videoOnlyStream = new MediaStream();
            const vTrack = captureStream.getVideoTracks()[0];
            if (vTrack) videoOnlyStream.addTrack(vTrack);
            hiddenVideo.srcObject = videoOnlyStream;
            hiddenVideo.play().catch(e => log(`Video play 警告: ${e.message}`, 'warn'));
        }

        drawOneFrame();
        drawTimer = setInterval(() => drawOneFrame(), intervalMs);
        log(`Canvas 代理启动: ${CANVAS_W}x${CANVAS_H} @ ${CANVAS_FPS}fps`, 'info');

        // 看门狗
        watchdogTimer = setInterval(() => {
            if (drawFrameCount === lastDrawFrameCount) {
                log('⚠️ Canvas 看门狗触发：绘制已停止，重启定时器', 'warn');
                clearInterval(drawTimer);
                drawTimer = setInterval(() => drawOneFrame(), intervalMs);
            }
            lastDrawFrameCount = drawFrameCount;
        }, 3000);
    }

    function stopCanvasDraw() {
        if (drawTimer) { clearInterval(drawTimer); drawTimer = null; }
        if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
        if (hiddenVideo) {
            hiddenVideo.srcObject = null;
            hiddenVideo = null;
        }
    }

    // ========== 构建推流 MediaStream ==========
    function buildPushStream() {
        // Canvas 视频
        const canvasStream = $('proxyCanvas').captureStream(CANVAS_FPS);
        const vTrack = canvasStream.getVideoTracks()[0];

        // 真实音频（从屏幕捕获流中获取）
        let aTrack = null;
        if (captureStream) {
            aTrack = captureStream.getAudioTracks()[0];
        }

        const finalStream = new MediaStream();
        if (vTrack) finalStream.addTrack(vTrack);
        if (aTrack) finalStream.addTrack(aTrack);

        log(`推流 MediaStream 就绪: video=${vTrack ? 1 : 0} audio=${aTrack ? 1 : 0}`, 'success');
        return finalStream;
    }

    // ========== 推流主流程 ==========
    async function startPush() {
        stopPush();
        isStreaming = false;
        joined = false;

        // 读取配置
        const [w, h] = $('resSelect').value.split('x').map(Number);
        CANVAS_W = w || 854;
        CANVAS_H = h || 480;
        CANVAS_FPS = parseInt($('fpsSelect').value, 10) || 25;
        CUR_BITRATE_KBPS = parseInt($('bitrateSelect').value, 10) || 2000;
        ROOM_ID = $('roomIdInput').value || 'stream_001';
        document.getElementById('roomIdDisplay').textContent = ROOM_ID;

        setButtons(true);
        setStatus('⏳ 请求屏幕共享（请勾选"分享音频"）...', 'connecting');

        try {
            // 1. 获取屏幕流（含真实音频）
            captureStream = await getDisplayMediaStream();

            // 2. 启动 Canvas 代理
            startCanvasDraw();

            // 3. 构建推流 MediaStream
            localStream = buildPushStream();
            if (!localStream || localStream.getTracks().length === 0) {
                throw new Error('构建 MediaStream 失败（0 tracks）');
            }
            $('localVideo').srcObject = localStream;
            try { await $('localVideo').play(); } catch (e) {
                log('localVideo autoplay 被拦截: ' + e.message, 'warn');
            }

            log(`本地 MediaStream 组装完成，轨道数: ${localStream.getTracks().length}`, 'success');

            // 4. 连接信令
            const wsUrl = $('wsUrlInput').value || WS_URL;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log('✅ 信令已连接', 'success');
                ws.send(JSON.stringify({ type: 'join', role: 'push', streamId: ROOM_ID }));
                log(`📤 发送 join(push) 房间: ${ROOM_ID}`, 'info');
            };

            ws.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    log(`📩 信令: ${msg.type}`, 'info');

                    switch (msg.type) {
                        case 'joined':
                            joined = true;
                            log('✅ 服务端确认加入房间', 'success');
                            await createPeerConnection();
                            await createOffer();
                            break;

                        case 'answer':
                            if (pc) {
                                await pc.setRemoteDescription(new RTCSessionDescription(msg));
                                log('✅ Answer 已设置', 'success');
                            }
                            break;

                        case 'candidate':
                            if (pc && msg.candidate) {
                                const candObj = { candidate: msg.candidate };
                                if (msg.sdpMid !== undefined && msg.sdpMid !== null) candObj.sdpMid = msg.sdpMid;
                                if (Number.isInteger(msg.sdpMLineIndex)) candObj.sdpMLineIndex = msg.sdpMLineIndex;
                                if (msg.usernameFragment) candObj.usernameFragment = msg.usernameFragment;
                                await pc.addIceCandidate(new RTCIceCandidate(candObj));
                            }
                            break;

                        default:
                            log(`未知信令类型: ${msg.type}`, 'warn');
                    }
                } catch (e) {
                    log(`信令处理错误: ${e.message}`, 'error');
                }
            };

            ws.onerror = () => {
                log('❌ 信令连接错误', 'error');
                setStatus('❌ 信令错误', 'failed');
                stopPush();
            };

            ws.onclose = () => {
                log('🔌 信令已断开', 'warn');
                if (isStreaming) {
                    setStatus('⚠️ 连接断开', 'failed');
                    stopPush();
                }
            };

        } catch (e) {
            log(`❌ 启动失败: ${e.message}`, 'error');
            setStatus('❌ 启动失败', 'failed');
            setButtons(false);
            stopAll();
        }
    }

    async function createPeerConnection() {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

        localStream.getTracks().forEach(track => {
            pc.addTransceiver(track, {
                direction: 'sendonly',
                streams: [localStream],
                sendEncodings: [{
                    maxBitrate: CUR_BITRATE_KBPS * 1000,
                    maxFramerate: CANVAS_FPS,
                    priority: 'high',
                    networkPriority: 'high',
                }]
            });
        });

        // 设置编码参数
        const senders = pc.getSenders();
        senders.forEach(sender => {
            if (sender.track && sender.track.kind === 'video') {
                const params = sender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = CUR_BITRATE_KBPS * 1000;
                params.encodings[0].maxFramerate = CANVAS_FPS;
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                try { params.degradationPreference = 'balanced'; } catch (_) {}
                sender.setParameters(params).catch(e => log(`设置编码参数失败: ${e.message}`, 'warn'));
            }
        });

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                const c = event.candidate.candidate;
                if (c.includes('.local') || c.includes('0.0.0.0')) return;
                ws.send(JSON.stringify({
                    type: 'candidate',
                    candidate: c,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex,
                    usernameFragment: event.candidate.usernameFragment,
                }));
            }
        };

        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            log(`ICE: ${state}`, 'info');
            if (state === 'connected' || state === 'completed') {
                setStatus('✅ 推流中', 'streaming');
                isStreaming = true;
                startKeyFrameLoop();
            } else if (state === 'failed' || state === 'disconnected') {
                setStatus('❌ ICE 断开', 'failed');
                stopPush();
            }
        };

        pc.onconnectionstatechange = () => {
            const state = pc.connectionState;
            log(`连接: ${state}`, 'info');
            if (state === 'connected') {
                setStatus('✅ 推流中', 'streaming');
                isStreaming = true;
                startKeyFrameLoop();
            } else if (state === 'failed') {
                setStatus('❌ 连接失败', 'failed');
                stopPush();
            }
        };
    }

    // ========== 关键帧循环 ==========
    let _keyFrameTimer = null;
    function startKeyFrameLoop2() {
        if (_keyFrameTimer) return;
        let count = 0;
        _keyFrameTimer = setInterval(async () => {
            if (!pc || !isStreaming) return;
            const senders = pc.getSenders();
            for (const s of senders) {
                if (s.track && s.track.kind === 'video') {
                    try {
                        if (typeof s.requestKeyFrame === 'function') {
                            await s.requestKeyFrame();
                            count++;
                            if (count % 10 === 1) log(`📸 关键帧 ×${count}`, 'info');
                        }
                    } catch (e) {}
                }
            }
        }, 2000);
    }

    function startKeyFrameLoop() {
        if (_keyFrameTimer) return;
        let count = 0;
        _keyFrameTimer = setInterval(async () => {
            if (!pc || !isStreaming) return;
            const senders = pc.getSenders();
            for (const s of senders) {
                if (s.track && s.track.kind === 'video') {
                    try {
                        const params = s.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        // 切换 degradationPreference 强制编码器输出关键帧
                        params.degradationPreference =
                            params.degradationPreference === 'balanced' ? 'maintain-framerate' : 'balanced';
                        await s.setParameters(params);
                        count++;
                        if (count % 10 === 1) log(`📸 强制关键帧 ×${count}`, 'info');
                    } catch (e) {
                        // 忽略 setParameters 可能的错误（部分浏览器限制频率）
                    }
                }
            }
        }, 2000); // 每 2 秒强制一次
    }

    function stopKeyFrameLoop() {
        if (_keyFrameTimer) { clearInterval(_keyFrameTimer); _keyFrameTimer = null; }
    }

    // ========== 创建 Offer ==========
    async function createOffer() {
        try {
            let offer = await pc.createOffer({ offerToReceiveAudio: false, offerToReceiveVideo: false });
            // H.264 优先
            offer = prioritizeH264Codec(offer);
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
            log('📤 Offer 已发送', 'success');
            setStatus('⏳ 等待 Answer...', 'connecting');
        } catch (e) {
            log(`❌ 创建 Offer 失败: ${e.message}`, 'error');
        }
    }

    // ========== H.264 优先排序 ==========
    function prioritizeH264Codec(desc) {
        const sdp = desc.sdp || '';
        const lines = sdp.split(/\r\n|\n|\r/);
        const outLines = [];
        let inVideoSection = false;
        let videoSectionStartIdx = -1;
        let videoMlineOrig = null;
        let videoPtList = [];

        for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            if (l.startsWith('m=video ')) {
                inVideoSection = true;
                videoSectionStartIdx = i;
                videoMlineOrig = l;
                const parts = l.split(/\s+/);
                for (let j = 3; j < parts.length; j++) {
                    const p = parts[j].trim();
                    if (/^\d+$/.test(p)) videoPtList.push(p);
                }
                break;
            }
        }

        if (!videoMlineOrig || videoPtList.length === 0) return desc;

        const ptToCodec = new Map();
        const rtpmapMap = new Map();
        const fmtpMap = new Map();
        const fbMap = new Map();
        for (const k of videoPtList) { fmtpMap.set(k, []); fbMap.set(k, []); }
        const otherVideoLines = [];

        for (let i = videoSectionStartIdx + 1; i < lines.length; i++) {
            const l = lines[i];
            if (!l) continue;
            if (l.startsWith('m=')) break;

            const mRtpmap = l.match(/^a=rtpmap:(\d+)\s+([A-Za-z0-9_-]+)(?:\/|$)/);
            if (mRtpmap) {
                const pt = mRtpmap[1];
                if (videoPtList.indexOf(pt) === -1) { otherVideoLines.push(l); continue; }
                ptToCodec.set(pt, mRtpmap[2].toLowerCase());
                rtpmapMap.set(pt, l);
                continue;
            }
            const mFmtp = l.match(/^a=fmtp:(\d+)(?:\s|$)/);
            if (mFmtp) {
                const pt = mFmtp[1];
                if (videoPtList.indexOf(pt) !== -1) { fmtpMap.get(pt).push(l); }
                continue;
            }
            const mFb = l.match(/^a=rtcp-fb:(\d+)(?:\s|$)/);
            if (mFb) {
                const pt = mFb[1];
                if (videoPtList.indexOf(pt) !== -1) { fbMap.get(pt).push(l); }
                continue;
            }
            otherVideoLines.push(l);
        }

        function ptWeight(pt) {
            const c = (ptToCodec.get(pt) || '').toLowerCase();
            if (c === 'h264' || c === 'avc') return 0;
            if (c === 'vp8') return 10;
            if (c === 'vp9') return 20;
            if (c === 'av1') return 30;
            return 50;
        }

        const isForbiddenCodec = (c) => /^(red|ulpfec|flexfec|rtx)$/i.test(c || '');
        const sortedPts = videoPtList
            .filter(pt => !isForbiddenCodec(ptToCodec.get(pt) || ''))
            .sort((a, b) => ptWeight(a) - ptWeight(b));
        const finalPts = sortedPts.filter(pt => rtpmapMap.has(pt));
        if (finalPts.length === 0) return desc;

        const mParts = videoMlineOrig.split(/\s+/);
        mParts.splice(3, mParts.length - 3, ...finalPts);
        const newMline = mParts.join(' ');

        const newSection = [newMline];
        for (const pt of finalPts) {
            if (rtpmapMap.has(pt)) newSection.push(rtpmapMap.get(pt));
            const fm = fmtpMap.get(pt); if (fm && fm.length) for (const x of fm) newSection.push(x);
            const fb = fbMap.get(pt); if (fb && fb.length) for (const x of fb) newSection.push(x);
        }
        for (const l of otherVideoLines) newSection.push(l);

        for (let i = 0; i < videoSectionStartIdx; i++) outLines.push(lines[i]);
        for (const l of newSection) outLines.push(l);
        let i = videoSectionStartIdx + 1;
        for (; i < lines.length; i++) {
            if (lines[i].startsWith('m=')) break;
        }
        for (; i < lines.length; i++) outLines.push(lines[i]);

        return { type: desc.type, sdp: outLines.join('\r\n') + '\r\n' };
    }

    // ========== 停止 ==========
    function stopPush() {
        isStreaming = false;
        joined = false;
        setButtons(false);
        setStatus('⚪ 已停止', 'idle');
        log('⏹️ 已停止', 'warn');
        stopKeyFrameLoop();

        if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch (_) {} ws = null; }
        if (pc) { try { pc.close(); } catch (_) {} pc = null; }

        if (localStream) {
            localStream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
            localStream = null;
        }
        $('localVideo').srcObject = null;

        if (captureStream) {
            captureStream.getTracks().forEach(t => t.stop());
            captureStream = null;
        }

        stopCanvasDraw();
        $('btnStart').disabled = false;
    }

    function stopAll() {
        stopPush();
    }

    window.addEventListener('beforeunload', stopPush);

    // ========== 初始化 ==========
    document.getElementById('roomIdDisplay').textContent = ROOM_ID;
    log('🚀 屏幕推流器已就绪', 'success');
    log(`💡 配置: ${CANVAS_W}x${CANVAS_H} @ ${CANVAS_FPS}fps，使用真实音频`, 'info');
</script>
